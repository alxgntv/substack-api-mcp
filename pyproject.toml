# ─── Ariadne's Thread [AT-0009] ─────────────────────
# What: Standalone MCP package deps (mcp + requests only)
# Why: Remove private substack-api-client git dependency
# Date: 2026-07-28
# Related: [AT-0006] substack_api_mcp/client.py, [AT-0007] substack_api_mcp/server.py
# ─────────────────────────────────────────────────────
# ─── Ariadne's Thread [AT-0165] ─────────────────────
# What: Pin mcp[cli] to 1.x (<2)
# Why: mcp 2.x removed mcp.server.fastmcp; this server still uses FastMCP
# Date: 2026-09-05
# Related: [AT-0007] substack_api_mcp/server.py, official mcp v2 FastMCP migration
# ─────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "substack-api-mcp"
version = "0.1.0"
description = "MCP server to publish to Substack via any agent — Substack has no native publishing API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alex Ign" }]
dependencies = [
  "mcp[cli]>=1.2.0,<2",
  "requests>=2.31.0",
]

[project.scripts]
substack-api-mcp = "substack_api_mcp.server:main"

[tool.setuptools.packages.find]
include = ["substack_api_mcp*"]
